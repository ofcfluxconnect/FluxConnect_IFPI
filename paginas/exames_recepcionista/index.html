<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão de Laudos - FluxConnect Recepção</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-notificacoes="recepcao">
    <!-- Barra lateral da recepcao -->
    <aside class="sidebar">
      <div class="logo-container">
        <img src="../../midias/logo/fluxConnect_2.svg" alt="Logo FluxConnect" class="logo-fluxconnect" />
        <div>
          <p class="logo-nome">FluxConnect</p>
          <p class="logo-subtitulo">Recepção</p>
        </div>
      </div>

      <nav class="nav-links" aria-label="Menu da recepção">
        <a href="../tela_principal_recepcionista/index.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Painel</span>
        </a>
        <a href="../agenda_recepcionista/index.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/></svg>
          <span>Agenda</span>
        </a>
        <a href="../pacientes_recepcionista/index.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Pacientes</span>
        </a>
        <a href="../consultas_recepcionista/index.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 2.6A2 2 0 1 0 3 6h3a2 2 0 1 0-1.8-3.4"/><path d="M4.5 6v5a5.5 5.5 0 0 0 11 0V6"/><path d="M19.5 13a2.5 2.5 0 1 0 0 5"/><path d="M22 15.5v2A4.5 4.5 0 0 1 17.5 22h-1A4.5 4.5 0 0 1 12 17.5"/></svg>
          <span>Consultas</span>
        </a>
        <a href="#" class="link-ativo" aria-current="page">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v7.31"/><path d="M14 9.3V2"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/></svg>
          <span>Exames</span>
        </a>
        <a href="../relatorios_recepcionista/index.html">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Relatórios</span>
        </a>
      </nav>

      <!-- Conta da recepcao (nome generico: varias recepcionistas usam o mesmo acesso).
           Clicar abre o menu com "Sair da conta". -->
      <button type="button" class="container-user" data-menu-usuario aria-label="Recepcionista — opções da conta" title="Opções da conta">
        <span class="avatar-user" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <span class="info-user">
          <span class="nome-user">Recepcionista</span>
          <span class="tipo-user">Equipe da recepção</span>
        </span>
      </button>
    </aside>

    <main class="conteudo-principal">
      <header class="topo-pagina">
        <div>
          <h1 class="titulo-pagina" id="tituloPagina">Gestão de Laudos</h1>
          <p class="subtitulo-pagina" id="subtituloPagina">Faça upload dos laudos e acompanhe o status de cada solicitação.</p>
        </div>
        <div class="icones-topo">
          <button class="btn-topo" title="Notificações">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="ponto-notificacao"></span>
          </button>
        </div>
      </header>

      <div class="area-pagina">
        <div class="cards-resumo cards-tres">
          <div class="card-resumo">
            <p class="resumo-rotulo">Total de solicitações</p>
            <p class="resumo-numero" id="numTotal">0</p>
          </div>
          <div class="card-resumo resumo-amarelo">
            <p class="resumo-rotulo">Pendentes</p>
            <p class="resumo-numero" id="numPendentes">0</p>
          </div>
          <div class="card-resumo resumo-menta">
            <p class="resumo-rotulo">Disponíveis</p>
            <p class="resumo-numero" id="numDisponiveis">0</p>
          </div>
        </div>

        <section class="caixa">
          <div class="barra-ferramentas">
            <div class="campo-busca">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input type="search" autocomplete="off" id="inputBusca" placeholder="Buscar por paciente ou tipo de exame" />
            </div>
            <div class="filtros filtros-direita" id="filtros">
              <button type="button" class="filtro ativo" data-filtro="">Todos <span id="contTodos">0</span></button>
              <button type="button" class="filtro" data-filtro="pendente">Pendente <span id="contPendente">0</span></button>
              <button type="button" class="filtro" data-filtro="disponivel">Disponível <span id="contDisponivel">0</span></button>
            </div>
            <label class="ordenar">
              <span class="sr-only">Ordenar</span>
              <select id="ordem">
                <option value="recentes">Mais recentes</option>
                <option value="antigas">Mais antigas</option>
                <option value="pendentes">Pendentes primeiro</option>
                <option value="paciente">Paciente (A-Z)</option>
              </select>
            </label>
          </div>

          <div class="tabela-rolagem">
            <table class="tabela tabela-laudos">
              <thead>
                <tr><th>Paciente</th><th>Tipo de exame</th><th>Solicitado por</th><th>Solicitado em</th><th>Status</th><th>Ação</th></tr>
              </thead>
              <tbody id="corpoTabela"></tbody>
            </table>
          </div>

          <div class="rodape-tabela">
            <span id="txtExibindo"></span>
            <span id="txtAtualizado"></span>
          </div>
        </section>
      </div>

      <!-- seletor de arquivo usado pelos botoes de upload -->
      <input type="file" id="inputArquivo" accept="application/pdf,image/*" hidden />

      <!-- Visualizar / substituir laudo -->
      <div class="modal-overlay" id="modalLaudo">
        <div class="modal-caixa modal-laudo" role="dialog" aria-modal="true" aria-labelledby="laudoTitulo">
          <div class="modal-topo">
            <div>
              <h2 class="modal-titulo" id="laudoTitulo">Laudo</h2>
              <p class="modal-sub" id="laudoSub"></p>
            </div>
            <button type="button" class="modal-x" data-fechar title="Fechar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="modal-corpo">
            <div class="previa-laudo" id="laudoPrevia"></div>
            <p class="info-arquivo" id="laudoArquivo"></p>
          </div>
          <div class="modal-rodape">
            <button type="button" class="btn-secundario btn-remover" id="btnRemover">Remover arquivo</button>
            <span class="espaco"></span>
            <a class="btn-secundario" id="btnBaixar" download>Baixar</a>
            <button type="button" class="btn-primario" id="btnSubstituir">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Substituir
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="../compartilhado/recepcao_dados.js"></script>
    <script src="../compartilhado/recepcao_layout.js"></script>
    <script src="../compartilhado/notificacoes.js"></script>
    <script src="script.js"></script>
  </body>
</html>
