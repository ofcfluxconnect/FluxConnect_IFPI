
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluxConnect - Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../compartilhado/paciente_app.css" />
    <!-- App do paciente (PWA) -->
    <link rel="manifest" href="../../manifest.webmanifest" />
    <meta name="theme-color" content="#1a6fc4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="../../../midias/logo/app-icone-192.png" />
    <script src="../../compartilhado/paciente_app.js"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <main class="fundo">
        <section class="cartao-cadastro" aria-labelledby="titulo-principal">

            <header>
                <span class="logo" aria-hidden="true">
                  <img src="logo.png" alt="Logo FluxConnect" class="logo">
                </span>
                <h1 id="titulo-principal">FluxConnect</h1>
                <h2>Cadastre-se</h2>
                <p>Crie sua conta no FluxConnect!</p>
            </header>

            <form id="formCadastro" novalidate>

                <h3>Dados Pessoais</h3>

                <label for="nome">
                    Nome Completo
                    <input type="text"id="nome"name="nome"placeholder="Digite seu nome completo"autocomplete="name"required>
                </label>
                <label for="cpf">
                    CPF
                    <input type="text"id="cpf"name="cpf"placeholder="000.000.000-00"maxlength="14"inputmode="numeric"required>
                </label>
                <label for="cns">
                    Cartão SUS (CNS) <span class="opcional">opcional</span>
                    <input type="text" id="cns" name="cns" placeholder="000 0000 0000 0000" maxlength="18" inputmode="numeric" aria-describedby="dicaCns">
                    <small class="dica" id="dicaCns">É o número de 15 dígitos do seu Cartão SUS. Se não souber, a sua UBS informa.</small>
                </label>
                <section class="linha">
                    <label for="nascimento">
                        Data de Nascimento
                        <input type="date"id="nascimento"name="nascimento"required>
                    </label>
                    <label for="sexo">
                        Sexo
                        <select id="sexo" name="sexo" required>
                            <option value="">Selecione</option>
                            <option value="feminino">Feminino</option>
                            <option value="masculino">Masculino</option>
                            <option value="outro">Outro</option>
                        </select>
                    </label>

                </section>
                <label for="telefone">
                    Celular (WhatsApp)
                    <input type="tel"id="telefone"name="telefone"placeholder="(00) 00000-0000"maxlength="15"required>
                </label>
                <label for="email">
                    E-mail <span class="opcional">opcional</span>
                    <input type="email"id="email"name="email"placeholder="email@exemplo.com">
                </label>

                <h3>Endereço</h3>
                <section class="linha">

                    <label for="cep">
                        CEP
                        <input type="text"id="cep"name="cep"placeholder="00000-000"maxlength="9"inputmode="numeric"required>
                    </label>
                    <label for="numero">
                        Número
                        <input type="text"id="numero"name="numero"placeholder="Ex: 123"required>
                    </label>

                </section>
                <label for="rua">
                    Rua
                    <input type="text"id="rua"name="rua"placeholder="Nome da rua"required>
                </label>

                <section class="linha">

                    <label for="bairro">
                        Bairro
                        <input type="text"id="bairro"name="bairro"placeholder="Nome do bairro"required>
                    </label>

                    <label for="cidade">
                        Cidade
                        <input type="text"id="cidade"name="cidade"placeholder="Nome da cidade"required>
                    </label>

                </section>
                <label for="estado">
                    Estado
                    <select id="estado" name="estado" required>
                        <option value="">Selecione</option>
                        <option value="PI">Piauí</option>
                        <option value="MA">Maranhão</option>
                        <option value="CE">Ceará</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                    </select>
                </label>

                <h3>Sua UBS</h3>
                <!-- Lista de exemplo: as UBS reais virao da API da prefeitura -->
                <label for="ubs">
                    UBS onde você é atendido
                    <select id="ubs" name="ubs" required aria-describedby="dicaUbs">
                        <option value="">Selecione</option>
                        <option value="UBS Centro">UBS Centro</option>
                        <option value="UBS Bairro Norte">UBS Bairro Norte</option>
                        <option value="UBS Bairro Sul">UBS Bairro Sul</option>
                        <option value="UBS Zona Rural">UBS Zona Rural</option>
                        <option value="Não sei">Não sei qual é a minha UBS</option>
                    </select>
                    <small class="dica" id="dicaUbs">É a unidade de saúde mais perto da sua casa, onde você marca suas consultas.</small>
                </label>

                <h3>Segurança</h3>
                <label for="senha">
                    Senha
                    <input type="password"id="senha"name="senha"placeholder="Digite sua senha"minlength="8"required>
                </label>
                <label for="confirmarSenha">
                    Confirmar Senha
                    <input type="password"id="confirmarSenha"name="confirmarSenha"placeholder="Confirme sua senha"required>
                </label>

                <h3>Termos de Uso</h3>

                <label class="aceite">
                    <input type="checkbox"id="termos"required>
                    Aceito os termos de uso
                </label>

                <label class="aceite">
                    <input type="checkbox"id="privacidade"required>
                    Aceito a política de privacidade
                </label>

                <p
                    id="mensagem"
                    role="status"
                    aria-live="polite"
                ></p>

                <button type="submit">
                    Cadastrar-se
                </button>

            </form>

        </section>

    </main>

</body>
</html>
